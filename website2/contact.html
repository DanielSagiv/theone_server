<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE1 - Contact Us</title>
    <link rel="stylesheet" href="/website2/assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="/website2/assets/logo.png" alt="THE ONE PRIVATE CLUB">
            </div>
            <ul class="nav-menu">
                <li><a href="/website2">Home</a></li>
                <li><a href="/website2#offering">Our Offering</a></li>
                <li><a href="/website2#experience">Experience</a></li>
                <li><a href="/website2#benefits">Benefits</a></li>
                <li><a href="/website2#join">Join</a></li>
                <li><a href="/website2/contact" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content contact-page">
        <div class="contact-content-box">
            <h1 class="contact-title">Contact</h1>
            <p class="contact-subtitle">Get in touch with The One Private Club</p>
            <div class="contact-form-container">
                <form class="contact-form">
                    <!-- Honeypot field for bot/spam protection: should remain empty -->
                    <div class="contact-form-group contact-honeypot">
                        <label for="contact-company">Company</label>
                        <input type="text" id="contact-company" name="company" class="contact-input" autocomplete="off">
                    </div>
                    <div class="contact-form-group">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="name" placeholder="Enter your name" class="contact-input" required>
                    </div>
                    <div class="contact-form-group">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" placeholder="Enter your email" class="contact-input" required>
                    </div>
                    <div class="contact-form-group">
                        <label for="contact-phone">Phone</label>
                        <input type="tel" id="contact-phone" name="phone" placeholder="Enter your phone number" class="contact-input">
                    </div>
                    <div class="contact-form-group">
                        <label for="contact-subject">Subject</label>
                        <input type="text" id="contact-subject" name="subject" placeholder="What is this regarding?" class="contact-input" required>
                    </div>
                    <div class="contact-form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" rows="5" placeholder="Enter your message" class="contact-textarea" required></textarea>
                    </div>
                    <button type="submit" class="contact-submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 THE1. All rights reserved. | <a href="/website2/terms" class="footer-link">Terms and Conditions</a> | <a href="/website2/privacy" class="footer-link">Privacy Policy</a></p>
        </div>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var form = document.querySelector('.contact-form');
        if (!form) return;

        var submitBtn = form.querySelector('.contact-submit-btn');
        var statusEl = document.createElement('div');
        statusEl.className = 'contact-status-message';
        form.appendChild(statusEl);

        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          var name = document.getElementById('contact-name').value.trim();
          var email = document.getElementById('contact-email').value.trim();
          var phone = document.getElementById('contact-phone').value.trim();
          var subject = document.getElementById('contact-subject').value.trim();
          var message = document.getElementById('contact-message').value.trim();

          if (!name || !email || !subject || !message) {
            statusEl.textContent = 'Please fill in all required fields.';
            statusEl.classList.remove('success');
            statusEl.classList.add('error');
            return;
          }

          var originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending...';
          statusEl.textContent = '';
          statusEl.classList.remove('success', 'error');

          try {
            var resp = await fetch('/website2/contact', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                name: name,
                email: email,
                phone: phone,
                subject: subject,
                message: message
              })
            });

            var data = {};
            try {
              data = await resp.json();
            } catch (parseErr) {
              data = {};
            }

            if (resp.ok && data.success) {
              statusEl.textContent = 'Thank you. Your message has been sent.';
              statusEl.classList.remove('error');
              statusEl.classList.add('success');
              form.reset();
            } else {
              statusEl.textContent = (data && data.error) ? data.error : 'There was a problem sending your message. Please try again.';
              statusEl.classList.remove('success');
              statusEl.classList.add('error');
            }
          } catch (err) {
            console.error('Error submitting contact form:', err);
            statusEl.textContent = 'There was a problem sending your message. Please try again.';
            statusEl.classList.remove('success');
            statusEl.classList.add('error');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });
      });
    </script>
</body>
</html>
